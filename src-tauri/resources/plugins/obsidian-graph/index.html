<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wiki &amp; Graph</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #ffffff;
        color: #1f2937;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid #e5e7eb;
      }
      h1 {
        font-size: 15px;
        font-weight: 650;
        margin: 0;
      }
      button,
      input,
      select {
        font: inherit;
        font-size: 12.5px;
      }
      button {
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        background: #f9fafb;
        color: #1f2937;
        cursor: pointer;
      }
      button:hover {
        background: #eef2ff;
        border-color: #8b5cf6;
      }
      #stage {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #graph {
        position: absolute;
        inset: 0;
      }
      #graph canvas {
        outline: none;
      }
      #filters {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 220px;
        padding: 10px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
      }
      #filters label {
        font-size: 11px;
        font-weight: 650;
        color: #6b7280;
      }
      #filters input,
      #filters select {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background: #fff;
        color: #1f2937;
        outline: none;
      }
      #filters input:focus,
      #filters select:focus {
        border-color: #8b5cf6;
      }
      #status {
        padding: 12px 16px;
        color: #6b7280;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>🕸️ Wiki &amp; Graph</h1>
        <button id="reload" type="button">Обновить</button>
      </header>
      <div id="stage">
        <div id="filters">
          <label for="f-search">Поиск</label>
          <input id="f-search" type="search" placeholder="Название заметки…" />
          <label for="f-category">Категория</label>
          <select id="f-category">
            <option value="">Все категории</option>
          </select>
          <label for="f-tag">Тег</label>
          <select id="f-tag">
            <option value="">Все теги</option>
          </select>
        </div>
        <div id="graph"></div>
      </div>
      <div id="status">Загрузка…</div>
    </div>

    <script>
      (function () {
        const WIKI_RE = /\[\[([^\]\n]+)\]\]/g;
        const statusEl = document.getElementById("status");
        const graphEl = document.getElementById("graph");
        const searchEl = document.getElementById("f-search");
        const categoryEl = document.getElementById("f-category");
        const tagEl = document.getElementById("f-tag");

        let nodesDS = null;
        let edgesDS = null;
        let allNodes = [];
        let allEdges = [];

        function callPlugin(action, payload = {}) {
          return new Promise((resolve, reject) => {
            const id = Math.random().toString(36).slice(2);
            let handler = null;
            const timer = setTimeout(() => {
              if (handler) window.removeEventListener("message", handler);
              reject(new Error("Таймаут ответа приложения"));
            }, 60000);
            handler = (event) => {
              if (event.data && event.data.type === "taskflow:response" && event.data.id === id) {
                window.removeEventListener("message", handler);
                clearTimeout(timer);
                if (event.data.error) reject(new Error(event.data.error));
                else resolve(event.data.data);
              }
            };
            window.addEventListener("message", handler);
            window.parent.postMessage({ type: "taskflow:request", id, action, payload }, "*");
          });
        }

        function showStatus(text) {
          statusEl.style.display = "block";
          statusEl.textContent = text;
        }

        function applyFilters() {
          if (!nodesDS || !edgesDS) {
            return;
          }
          const query = searchEl.value.trim().toLowerCase();
          const category = categoryEl.value;
          const tag = tagEl.value;
          const visible = allNodes.filter((node) => {
            if (query && !String(node.label).toLowerCase().includes(query)) return false;
            if (category && node.group !== category) return false;
            if (tag && !(node.tags || []).includes(tag)) return false;
            return true;
          });
          const ids = new Set(visible.map((node) => node.id));
          const edges = allEdges.filter((edge) => ids.has(edge.from) && ids.has(edge.to));
          nodesDS.clear();
          edgesDS.clear();
          nodesDS.add(visible);
          edgesDS.add(edges);
        }

        function fillSelect(select, values, placeholder) {
          select.innerHTML = "";
          const base = document.createElement("option");
          base.value = "";
          base.textContent = placeholder;
          select.appendChild(base);
          for (const value of values) {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = value;
            select.appendChild(option);
          }
        }

        async function build() {
          graphEl.innerHTML = "";
          showStatus("Загрузка заметок…");
          try {
            const notes = await callPlugin("getNotes", {});
            if (!Array.isArray(notes)) {
              throw new Error("Некорректный список заметок");
            }
            if (notes.length === 0) {
              showStatus("В этом пространстве пока нет заметок.");
              return;
            }

            const byTitle = new Map();
            for (const note of notes) {
              byTitle.set(String(note.title || "").trim().toLowerCase(), note);
            }

            allNodes = notes.map((note) => ({
              id: note.id,
              label: note.title,
              group: note.category || "Без категории",
              tags: Array.isArray(note.tags) ? note.tags : [],
            }));
            allEdges = [];
            const seen = new Set();

            for (const note of notes) {
              let full = null;
              try {
                full = await callPlugin("getNoteContent", { noteId: note.id });
              } catch (e) {
                continue;
              }
              const content = full && typeof full.content === "string" ? full.content : "";
              let match;
              WIKI_RE.lastIndex = 0;
              while ((match = WIKI_RE.exec(content))) {
                const target = byTitle.get(match[1].trim().toLowerCase());
                if (!target || target.id === note.id) {
                  continue;
                }
                const key = note.id + "->" + target.id;
                if (seen.has(key)) {
                  continue;
                }
                seen.add(key);
                allEdges.push({ from: note.id, to: target.id, arrows: "to" });
              }
            }

            const categories = [...new Set(allNodes.map((node) => node.group))].sort();
            const tags = [...new Set(allNodes.flatMap((node) => node.tags))].sort();
            fillSelect(categoryEl, categories, "Все категории");
            fillSelect(tagEl, tags, "Все теги");

            statusEl.style.display = "none";
            nodesDS = new vis.DataSet(allNodes);
            edgesDS = new vis.DataSet(allEdges);
            const network = new vis.Network(
              graphEl,
              { nodes: nodesDS, edges: edgesDS },
              {
                nodes: {
                  shape: "dot",
                  size: 14,
                  font: { color: "#1f2937", size: 13 },
                  borderWidth: 1,
                  color: { background: "#eef2ff", border: "#8b5cf6" },
                },
                edges: {
                  color: { color: "#9ca3af", highlight: "#8b5cf6" },
                  smooth: true,
                  arrows: { to: { enabled: true, scaleFactor: 0.6 } },
                },
                physics: {
                  stabilization: true,
                  barnesHut: { gravitationalConstant: -4000, springLength: 130 },
                },
                interaction: { hover: true, tooltipDelay: 200 },
              },
            );
            network.on("click", (params) => {
              if (params.nodes && params.nodes.length > 0) {
                const noteId = params.nodes[0];
                void callPlugin("navigate", { path: "/app/kb/" + noteId }).catch(() => {});
              }
            });
          } catch (error) {
            showStatus("Не удалось построить граф: " + (error && error.message ? error.message : error));
          }
        }

        searchEl.addEventListener("input", applyFilters);
        categoryEl.addEventListener("change", applyFilters);
        tagEl.addEventListener("change", applyFilters);
        document.getElementById("reload").addEventListener("click", () => {
          allNodes = [];
          allEdges = [];
          nodesDS = null;
          edgesDS = null;
          void build();
        });
        void build();
      })();
    </script>
  </body>
</html>
