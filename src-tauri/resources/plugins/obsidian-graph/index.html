<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Граф заметок</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #ffffff;
        color: #1f2937;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid #e5e7eb;
      }
      h1 {
        font-size: 15px;
        font-weight: 650;
        margin: 0;
      }
      button {
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        background: #f9fafb;
        color: #1f2937;
        cursor: pointer;
      }
      button:hover {
        background: #eef2ff;
        border-color: #8b5cf6;
      }
      #status {
        padding: 12px 16px;
        color: #6b7280;
        font-size: 13px;
      }
      #graph {
        flex: 1;
        min-height: 0;
      }
      #graph canvas {
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>🕸️ Граф заметок</h1>
        <button id="reload" type="button">Обновить</button>
      </header>
      <div id="status">Загрузка…</div>
      <div id="graph"></div>
    </div>

    <script>
      (function () {
        const WIKI_RE = /\[\[([^\]\n]+)\]\]/g;
        const statusEl = document.getElementById("status");
        const graphEl = document.getElementById("graph");

        function callPlugin(action, payload = {}) {
          return new Promise((resolve, reject) => {
            const id = Math.random().toString(36).slice(2);
            let handler = null;
            const timer = setTimeout(() => {
              if (handler) window.removeEventListener("message", handler);
              reject(new Error("Таймаут ответа приложения"));
            }, 60000);
            handler = (event) => {
              if (event.data && event.data.type === "taskflow:response" && event.data.id === id) {
                window.removeEventListener("message", handler);
                clearTimeout(timer);
                if (event.data.error) reject(new Error(event.data.error));
                else resolve(event.data.data);
              }
            };
            window.addEventListener("message", handler);
            window.parent.postMessage({ type: "taskflow:request", id, action, payload }, "*");
          });
        }

        function showStatus(text) {
          statusEl.style.display = "block";
          statusEl.textContent = text;
        }

        async function build() {
          graphEl.innerHTML = "";
          showStatus("Загрузка заметок…");
          try {
            const notes = await callPlugin("getNotes", {});
            if (!Array.isArray(notes)) {
              throw new Error("Некорректный список заметок");
            }
            if (notes.length === 0) {
              showStatus("В этом пространстве пока нет заметок.");
              return;
            }

            const byTitle = new Map();
            for (const note of notes) {
              byTitle.set(String(note.title || "").trim().toLowerCase(), note);
            }

            const nodes = notes.map((note) => ({
              id: note.id,
              label: note.title,
              group: note.category || "Без категории",
            }));
            const edges = [];
            const seen = new Set();

            for (const note of notes) {
              let full = null;
              try {
                full = await callPlugin("getNoteContent", { noteId: note.id });
              } catch (e) {
                continue;
              }
              const content = full && typeof full.content === "string" ? full.content : "";
              let match;
              WIKI_RE.lastIndex = 0;
              while ((match = WIKI_RE.exec(content))) {
                const target = byTitle.get(match[1].trim().toLowerCase());
                if (!target || target.id === note.id) {
                  continue;
                }
                const key = note.id + "->" + target.id;
                if (seen.has(key)) {
                  continue;
                }
                seen.add(key);
                edges.push({ from: note.id, to: target.id, arrows: "to" });
              }
            }

            statusEl.style.display = "none";
            const network = new vis.Network(
              graphEl,
              { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) },
              {
                nodes: {
                  shape: "dot",
                  size: 14,
                  font: { color: "#1f2937", size: 13 },
                  borderWidth: 1,
                  color: { background: "#eef2ff", border: "#8b5cf6" },
                },
                edges: {
                  color: { color: "#9ca3af", highlight: "#8b5cf6" },
                  smooth: true,
                  arrows: { to: { enabled: true, scaleFactor: 0.6 } },
                },
                physics: {
                  stabilization: true,
                  barnesHut: { gravitationalConstant: -4000, springLength: 130 },
                },
                interaction: { hover: true, tooltipDelay: 200 },
              },
            );
            network.on("click", (params) => {
              if (params.nodes && params.nodes.length > 0) {
                const noteId = params.nodes[0];
                void callPlugin("navigate", { path: "/app/kb/" + noteId }).catch(() => {});
              }
            });
          } catch (error) {
            showStatus("Не удалось построить граф: " + (error && error.message ? error.message : error));
          }
        }

        document.getElementById("reload").addEventListener("click", () => void build());
        void build();
      })();
    </script>
  </body>
</html>
