name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.6.0). Create/push the tag first."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # tauri-action runs `npm run tauri build`, signs the updater artifacts and
      # creates/updates the GitHub Release with:
      #   - TaskFlow_<version>_x64_en-US.msi (WiX)
      #   - TaskFlow_<version>_x64-setup.exe (NSIS)
      #   - their .sig signature files
      #   - latest.json (consumed by the in-app updater)
      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "TaskFlow ${{ inputs.tag || github.ref_name }}"
          releaseBody: |
            Автоматический релиз TaskFlow ${{ inputs.tag || github.ref_name }}.
            Установщики (MSI/EXE), их подписи и latest.json прикреплены ниже.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc
