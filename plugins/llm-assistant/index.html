<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Ассистент</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        background: #fff;
        color: #1a1d23;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .app {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid #e6e8ec;
      }
      header h1 {
        margin: 0;
        font-size: 14px;
      }
      #settingsBtn {
        border: 1px solid #e6e8ec;
        border-radius: 6px;
        background: #f1f2f5;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 12.5px;
      }
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .msg {
        max-width: 85%;
        padding: 8px 12px;
        border-radius: 10px;
        font-size: 13.5px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg.user {
        align-self: flex-end;
        background: #5b5bd6;
        color: #fff;
      }
      .msg.assistant {
        align-self: flex-start;
        background: #f1f2f5;
        color: #1a1d23;
      }
      .status {
        padding: 6px 14px;
        color: #6b7280;
        font-size: 12px;
      }
      .composer {
        display: flex;
        gap: 8px;
        padding: 10px 14px;
        border-top: 1px solid #e6e8ec;
      }
      #input {
        flex: 1;
        resize: none;
        border: 1px solid #e6e8ec;
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 13.5px;
        font-family: inherit;
        outline: none;
      }
      #input:focus {
        border-color: #5b5bd6;
      }
      #send {
        border: none;
        border-radius: 8px;
        width: 42px;
        background: #5b5bd6;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
      }
      .modal {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: rgba(10, 12, 16, 0.45);
      }
      .hidden {
        display: none !important;
      }
      .modalCard {
        width: min(420px, 92vw);
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 18px;
        border: 1px solid #e6e8ec;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
      }
      .modalCard h2 {
        margin: 0;
        font-size: 15px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        color: #6b7280;
      }
      input {
        border: 1px solid #e6e8ec;
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 13px;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .btn {
        border: 1px solid #e6e8ec;
        border-radius: 6px;
        background: #f1f2f5;
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      .btn-primary {
        border-color: #5b5bd6;
        background: #5b5bd6;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>AI Ассистент</h1>
        <button id="settingsBtn" title="Настройки">⚙ Настройки</button>
      </header>
      <div class="status" id="status">Настройте API в ⚙ и отправьте сообщение.</div>
      <div class="messages" id="messages"></div>
      <div class="composer">
        <textarea
          id="input"
          rows="2"
          placeholder="Например: создай заметку про архитектуру"
        ></textarea>
        <button id="send" title="Отправить">➤</button>
      </div>
    </div>

    <div class="modal hidden" id="settingsModal">
      <div class="modalCard">
        <h2>Настройки API</h2>
        <label>
          API URL
          <input id="apiUrl" value="https://openrouter.ai/api/v1/chat/completions" />
        </label>
        <label>
          API Key
          <input id="apiKey" type="password" placeholder="sk-..." />
        </label>
        <label>
          Модель
          <input id="model" value="openai/gpt-4o-mini" />
        </label>
        <div class="actions">
          <button class="btn" id="closeSettings">Закрыть</button>
          <button class="btn btn-primary" id="saveSettings">Сохранить</button>
        </div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const messagesEl = $("messages");
      const history = [];
      let busy = false;

      const DEFAULT_SETTINGS = {
        url: "https://openrouter.ai/api/v1/chat/completions",
        apiKey: "",
        model: "openai/gpt-4o-mini",
      };
      const settings = {
        ...DEFAULT_SETTINGS,
        ...JSON.parse(localStorage.getItem("llm-assistant") || "{}"),
      };

      $("apiUrl").value = settings.url;
      $("apiKey").value = settings.apiKey;
      $("model").value = settings.model;

      $("settingsBtn").addEventListener("click", () =>
        $("settingsModal").classList.remove("hidden"),
      );
      $("closeSettings").addEventListener("click", () =>
        $("settingsModal").classList.add("hidden"),
      );
      $("saveSettings").addEventListener("click", () => {
        settings.url = $("apiUrl").value.trim() || DEFAULT_SETTINGS.url;
        settings.apiKey = $("apiKey").value.trim();
        settings.model = $("model").value.trim() || DEFAULT_SETTINGS.model;
        localStorage.setItem("llm-assistant", JSON.stringify(settings));
        $("settingsModal").classList.add("hidden");
        setStatus("Настройки сохранены.");
      });

      function callPlugin(action, payload = {}) {
        return new Promise((resolve, reject) => {
          const id = Math.random().toString(36).slice(2);
          const handler = (event) => {
            if (event.data?.type === "taskflow:response" && event.data.id === id) {
              window.removeEventListener("message", handler);
              if (event.data.error) reject(new Error(event.data.error));
              else resolve(event.data.data);
            }
          };
          window.addEventListener("message", handler);
          window.parent.postMessage({ type: "taskflow:request", id, action, payload }, "*");
        });
      }

      function setStatus(text) {
        $("status").textContent = text;
      }

      function addMessage(role, text) {
        const el = document.createElement("div");
        el.className = "msg " + role;
        el.textContent = text;
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      const SYSTEM_PROMPT =
        "Ты — ИИ-ассистент, встроенный в десктоп-приложение TaskFlow (трекер задач и база знаний). " +
        "Отвечай кратко и по делу на русском языке. " +
        "Если пользователь просит создать заметки, верни ТОЛЬКО JSON-блок без пояснений и без markdown-кода: " +
        '{"action":"create_notes","notes":[{"title":"Название","content":"Содержание","tags":["тег"]}]}';

      function plural(n) {
        const mod10 = n % 10;
        const mod100 = n % 100;
        if (mod10 === 1 && mod100 !== 11) return "заметку";
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return "заметки";
        return "заметок";
      }

      function extractCreateNotes(content) {
        const fenced = content.match(/```(?:json)?\s*([\s\S]*?)```/);
        const candidates = fenced ? [fenced[1]] : [];
        const start = content.indexOf("{");
        const end = content.lastIndexOf("}");
        if (start >= 0 && end > start) candidates.push(content.slice(start, end + 1));
        for (const candidate of candidates) {
          try {
            const parsed = JSON.parse(candidate.trim());
            if (parsed && parsed.action === "create_notes" && Array.isArray(parsed.notes)) {
              return parsed;
            }
          } catch {
            // try the next candidate
          }
        }
        return null;
      }

      async function handleReply(content) {
        const plan = extractCreateNotes(content);
        if (!plan) {
          addMessage("assistant", content);
          history.push({ role: "assistant", content });
          return;
        }
        addMessage("assistant", "Создаю заметки…");
        let created = 0;
        for (const note of plan.notes || []) {
          try {
            await callPlugin("createNote", {
              title: String(note.title || "Заметка"),
              content: String(note.content || ""),
              category: "",
            });
            created += 1;
          } catch (err) {
            addMessage("assistant", "Не удалось создать заметку: " + err.message);
          }
        }
        const message = `Создано ${created} ${plural(created)}`;
        addMessage("assistant", message);
        await callPlugin("showToast", { message });
      }

      async function send() {
        if (busy) return;
        const text = $("input").value.trim();
        if (!text) return;
        $("input").value = "";
        addMessage("user", text);
        history.push({ role: "user", content: text });
        busy = true;
        setStatus("Запрос к LLM…");
        try {
          const body = JSON.stringify({
            model: settings.model,
            messages: [{ role: "system", content: SYSTEM_PROMPT }, ...history],
          });
          const raw = await callPlugin("llmChat", {
            url: settings.url,
            apiKey: settings.apiKey,
            body,
          });
          const json = JSON.parse(raw);
          const content = json?.choices?.[0]?.message?.content ?? "";
          if (!content) throw new Error("Пустой ответ от модели");
          await handleReply(content);
          setStatus("");
        } catch (err) {
          addMessage("assistant", "Ошибка: " + err.message);
          setStatus("");
        } finally {
          busy = false;
        }
      }

      $("send").addEventListener("click", () => void send());
      $("input").addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          void send();
        }
      });
    </script>
  </body>
</html>
